# Passed with --config: a typos.toml at $HOME would apply to every project below it.

[default]
# hex colors such as ff98ba
extend-ignore-re = ["\\b[0-9a-fA-F]{6}\\b"]

[default.extend-words]
# :enew, the Vim command
enew = "enew"
# 'formatoptions' short name
fo = "fo"
# hda-intel device names
hda = "hda"
noice = "noice"
Noice = "Noice"
# LSP symbol kind TemplateTypeParm
Parm = "Parm"
# Verneuil-sur-Seine
sur = "sur"
# tmux rose-pine theme variable prefix
thm = "thm"
