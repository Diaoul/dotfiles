general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# turn off keyboard backlight
listener {
    timeout = 150
    on-timeout = brightnessctl -sd dell::kbd_backlight set 0
    on-resume = brightnessctl -rd dell::kbd_backlight
}

# dim screen
listener {
    timeout = 300
    on-timeout = brightnessctl -sd intel_backlight set 10
    on-resume = brightnessctl -rd intel_backlight
}

# lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# turn off monitor
listener {
    timeout = 630
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# suspend
# only when on battery and nothing is playing; rechecked every 60s while idle,
# so suspend fires as soon as the condition clears (e.g. you unplug)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
    condition_cmd = [ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && ! grep -q RUNNING /proc/asound/card*/pcm*p/sub*/status 2>/dev/null
    condition_retry = 60
}
